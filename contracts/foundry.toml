[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "../app/src/deployments" },
]

# Ethereum Sepolia (chain id 11155111). SEPOLIA_RPC_URL is read from the environment.
# Do not commit a URL that contains an API key.
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
